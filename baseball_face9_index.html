<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>⚾ 好きな顔9選メーカー</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#20242b;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Yu Gothic",sans-serif}.app{max-width:720px;margin:auto;padding:16px 12px 40px}header{text-align:center;padding:8px 0 16px}h1{font-size:24px;margin:0 0 5px}.lead,.hint{color:#737984;font-size:13px;line-height:1.6}.card{background:#fff;border:1px solid #e6e8ed;border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 5px 20px #00000008}h2{font-size:18px;margin:0 0 10px}.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:800;min-height:48px}.primary{background:#20242b;color:#fff}.light{background:#eef0f3;color:#222}.wide{width:100%}#fileInput{display:none}.count{text-align:center;color:#737984;font-size:13px;margin:10px}.preview{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.thumb{position:relative;overflow:hidden;border-radius:11px;background:#eee}.thumb img{display:block;width:100%;aspect-ratio:1;object-fit:cover}.thumb span{position:absolute;left:3px;right:3px;bottom:3px;background:#000b;color:#fff;border-radius:5px;padding:3px;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.match{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choice{border:2px solid #e6e8ed;background:#fff;border-radius:18px;padding:6px}.choice img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:13px}.nm{text-align:center;font-weight:800;padding:8px 2px 6px}.progress{text-align:center;color:#737984;font-size:13px;margin-bottom:11px}.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.r{position:relative;overflow:hidden;border-radius:13px;background:#eee}.r img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.rank{position:absolute;top:5px;left:5px;background:#fff;border-radius:999px;padding:3px 7px;font-size:12px;font-weight:900}.rn{background:#fff;text-align:center;font-size:11px;font-weight:800;padding:6px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.center{text-align:center}#game,#result{display:none}.show{display:block!important}@media(max-width:430px){h1{font-size:22px}.card{padding:14px}}
</style></head>
<body><div class="app">
<header><h1>⚾ 好きな野球選手の顔9選</h1><p class="lead">写真を選ぶ → 2択で選ぶ → 最後にあなたの9選！</p></header>

<section class="card" id="setup">
<h2>① 写真を選ぶ</h2>
<p class="hint">iPhoneの「写真」から好きな野球選手をまとめて選んでね。写真のファイル名が選手名になるよ。あとから追加もOK！</p>
<input id="fileInput" type="file" accept="image/*" multiple>
<button class="btn primary wide" id="pickBtn">📷 写真を選ぶ</button>
<div id="count" class="count">まだ写真がありません</div><div id="preview" class="preview"></div>
<button class="btn primary wide" id="startBtn" style="margin-top:14px">💖 9選を作る！</button>
<p class="hint">※写真はこのページ内だけで使われ、サーバーには送信されません。ページを閉じると登録は消えます。</p>
</section>

<section class="card" id="game"><div class="progress" id="progress"></div><div class="match" id="match"></div>
<button class="btn light wide" id="skipBtn" style="margin-top:12px">この2人はスキップ</button></section>

<section class="card" id="result"><h2 class="center">🎉 あなたの好きな顔9選</h2><p class="hint center">選んだ回数をもとにランキングにしたよ！</p>
<div id="resultGrid" class="result-grid"></div>
<button class="btn primary wide" id="againBtn" style="margin-top:15px">もう一回選ぶ</button>
<button class="btn light wide" id="editBtn" style="margin-top:8px">写真を追加・変更する</button></section>
</div>

<script>
let people=[],score=[],pairs=[],question=0;
const $=id=>document.getElementById(id);
$('pickBtn').onclick=()=>$('fileInput').click();
$('fileInput').onchange=e=>{[...e.target.files].forEach(f=>{if(f.type.startsWith('image/'))people.push({name:f.name.replace(/\.[^.]+$/,''),url:URL.createObjectURL(f)})});e.target.value='';renderPreview()};
$('startBtn').onclick=start;$('skipBtn').onclick=next;$('againBtn').onclick=start;
$('editBtn').onclick=()=>{$('result').style.display='none';$('game').style.display='none';$('setup').style.display='block'};
function renderPreview(){$('count').textContent=people.length?`現在 ${people.length}人登録中`:'まだ写真がありません';$('preview').innerHTML=people.map(p=>`<div class="thumb"><img src="${p.url}"><span>${esc(p.name)}</span></div>`).join('')}
function start(){if(people.length<2){alert('まず2人以上の写真を選んでね！');return}score=people.map(()=>0);question=0;pairs=[];for(let i=0;i<people.length;i++)for(let j=i+1;j<people.length;j++)pairs.push([i,j]);shuffle(pairs);pairs=pairs.slice(0,Math.min(pairs.length,Math.max(30,people.length*5)));$('setup').style.display='none';$('result').style.display='none';$('game').style.display='block';show()}
function show(){if(!pairs.length){finish();return}let [a,b]=pairs.pop();question++;$('progress').textContent=`第 ${question} 問 ・ 残り ${pairs.length+1} 問`;$('match').innerHTML=[a,b].map(i=>`<button class="choice" onclick="choose(${i})"><img src="${people[i].url}"><div class="nm">${esc(people[i].name)}</div></button>`).join('')}
function choose(i){score[i]++;show()}function next(){show()}
function finish(){$('game').style.display='none';$('result').style.display='block';let ranked=people.map((p,i)=>({p,s:score[i]})).sort((a,b)=>b.s-a.s||Math.random()-.5).slice(0,9);$('resultGrid').innerHTML=ranked.map((x,n)=>`<div class="r"><span class="rank">${n+1}</span><img src="${x.p.url}"><div class="rn">${esc(x.p.name)}</div></div>`).join('')}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
renderPreview();
</script></body></html>
